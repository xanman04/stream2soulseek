[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "s2s"
version = "1.2.0"
description = "Streaming-service playlists, reviewed Soulseek downloads, and flat music libraries"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
    "spotapi @ https://github.com/Aran404/SpotAPI/archive/cb862571574e1ddbf5f8975f58a4f61a0e3d2050.zip",
    "curl_cffi>=0.15,<0.17",
    "websockets>=12,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "cryptography>=42"]  # cryptography: signing releases and checking s2s.ed25519 in tests

[project.gui-scripts]
s2s = "s2s.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s2s = ["ui/assets/*.png", "ui/assets/logos/*.svg", "ui/assets/logos/NOTICE.md", "update_windows.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

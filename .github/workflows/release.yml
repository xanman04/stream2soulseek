name: Release

# Builds the standalone app on GitHub's own Mac and Windows machines (a Mac app can only be built on a Mac) and,
# for a version tag such as v1.0, publishes the archives on the repository's Releases page.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: "macOS (Apple silicon)" }
          - { os: macos-15-intel, label: "macOS (Intel)" }
          - { os: windows-latest, label: "Windows" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install S2S and the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -c packaging/constraints.txt pyinstaller pillow
      - name: Run the tests
        run: |
          python -m pip install pytest cryptography
          python -m pytest -q -p no:cacheprovider
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the app
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: s2s-${{ matrix.os }}
          path: |
            dist/S2S-*.zip
            dist/S2S-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Verify release versions, all platform archives and checksums
        id: verify
        run: python packaging/verify_release.py assets --tag "$S2S_RELEASE_TAG"
        env:
          S2S_RELEASE_TAG: ${{ github.ref_name }}
      - name: Sign the archives for the in-app updater
        run: |
          python -m pip install cryptography
          python packaging/sign_release.py assets
          python packaging/verify_release.py assets --tag "$S2S_RELEASE_TAG" --signed
        env:
          S2S_UPDATE_SIGNING_KEY: ${{ secrets.S2S_UPDATE_SIGNING_KEY }}
          S2S_RELEASE_TAG: ${{ github.ref_name }}
      - id: draft
        uses: softprops/action-gh-release@v2
        with:
          name: S2S ${{ steps.verify.outputs.version }}
          body_path: packaging/RELEASE_NOTES.md
          files: assets/*
          fail_on_unmatched_files: true
          draft: true
      - name: Publish the complete release as Latest
        uses: actions/github-script@v7
        with:
          script: |
            // Look the draft up by its id: GitHub's by-tag lookup only returns published releases.
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const release_id = Number('${{ steps.draft.outputs.id }}');
            const {data: assets} = await github.rest.repos.listReleaseAssets({...repo, release_id, per_page: 100});
            if (assets.length !== 9) throw new Error(`Expected three archives, three checksums and three signatures, found ${assets.length}`);
            await github.rest.repos.updateRelease({...repo, release_id, draft: false, make_latest: 'true'});
